          component: comp_die
          tag: mat_decap1_eff
          density_group: def
          density_property: density
          elastic_group: anisotropic_eff
          elastic_property: D
          elasticity_order: standard
          D_format: symmetric_upper21
        stress:
          type: initial_stress
          component: comp_die
          physics: solid_die
          parent_feature: lemm1
          feature: initstress_decap1
          property: S0
          stress_format: diag_sxx_syy
      decap2:
        material:
          component: comp_die
