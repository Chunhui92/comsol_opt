templates:
  p01_wafer_init:
    path: models/process_models/p01_wafer_init.mph
    node_type: wafer
    studies:
      stress: std_warpage
      cp: null
    extractors:
      bow_x_um: gev_bow_x
      bow_y_um: gev_bow_y
    outputs:
      result_file: wafer_result.json

  pillar_generic:
    path: models/process_models/pillar_models/pillar_generic.mph
    node_type: pillar
    studies:
      stress: std_pillar
      cp: cp_pillar
    extractors:
      rho: gev_rho
      stress: gev_stress
      D: gev_D
    outputs:
      result_file: pillar_rve.json

  sc_model:
    path: models/process_models/sc_models/sc_model.mph
    node_type: sc
    studies:
      stress: std_sc
      cp: cp_sc
    extractors:
      rho: gev_rho
      stress: gev_stress
      D: gev_D
    outputs:
      result_file: sc_rve.json

  decap_model:
    path: models/process_models/cap_models/decap_model_all.mph
    node_type: decap
    studies:
      stress: std_decap
      cp: cp_decap
    extractors:
      rho: gev_rho
      stress: gev_stress
      D: gev_D
    outputs:
      result_file: decap_rve.json
    input_targets:
      pillar: &pillar_target
        material:
          component: comp_decap
          tag: mat_pillar_eff
          density_group: def
          density_property: density
          elastic_group: anisotropic_eff
          elastic_property: D
          elasticity_order: standard
          D_format: symmetric_upper21
        stress:
          type: initial_stress
          component: comp_decap
          physics: solid_decap
          parent_feature: lemm1
          feature: initstress_pillar
          property: S0
          stress_format: diag_sxx_syy

  fecap_model:
    path: models/process_models/cap_models/fecap_model_all.mph
    node_type: fecap
    studies:
      stress: std_fecap
      cp: cp_fecap
    extractors:
      rho: gev_rho
      stress: gev_stress
      D: gev_D
    outputs:
      result_file: fecap_rve.json
    input_targets:
      pillar: *pillar_target
      sc: &sc_target
        material:
          component: comp_fecap
          tag: mat_sc_eff
          density_group: def
          density_property: density
          elastic_group: anisotropic_eff
          elastic_property: D
          elasticity_order: standard
          D_format: symmetric_upper21
        stress:
          type: initial_stress
          component: comp_fecap
          physics: solid_fecap
          parent_feature: lemm1
          feature: initstress_sc
          property: S0
          stress_format: diag_sxx_syy

  fecap_stress_only:
    path: models/process_models/cap_models/fecap_feslit_etch.mph
    node_type: fecap
    studies:
      stress: std_fecap
      cp: null
    extractors:
      rho: gev_rho
      stress: gev_stress
      D: null
    outputs:
      result_file: fecap_rve.json
    input_targets:
      pillar: *pillar_target
      sc: *sc_target

  die_model:
    path: models/process_models/die_model.mph
    node_type: die
    studies:
      stress: std_die
      cp: cp_die
    extractors:
      rho: gev_rho
