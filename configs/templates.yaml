          elastic_group: anisotropic_eff
          elastic_property: D
          elasticity_order: standard
          D_format: symmetric_upper21
        stress:
          type: initial_stress
          component: comp_die
          physics: solid_die
          parent_feature: lemm1
          feature: initstress_fecap
          property: S0
          stress_format: diag_sxx_syy

  wafer_warp_model:
    path: models/process_models/wafer_warp_model.mph
    node_type: wafer
    studies:
      stress: std_warpage
      cp: null
    extractors:
      bow_x_um: gev_bow_x
      bow_y_um: gev_bow_y
    outputs:
      result_file: wafer_result.json
    input_targets:
      die: &die_target
        material:
          component: comp_wafer
          tag: mat_die_eff
          density_group: def
          density_property: density
