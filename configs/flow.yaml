flow_name: wafer_warpage_flow_v1
wafer_slots:
- FEOL
- mat1
- mat2
- mat3
- ONON_layer
- aSi_layer
templates:
  devices:
    device_onon: models/device_onon_template.mph
    device_trench: models/device_trench_template.mph
    device_pillar: models/device_pillar_template.mph
    device_final: models/device_final_template.mph
    device2_mat3: models/device2_mat3_template.mph
  mats:
    mat1: models/mat1_template.mph
    mat2: models/mat2_template.mph
    mat3: models/mat3_template.mph
  wafers:
    base: models/wafer_base_template.mph
    with_asi: models/wafer_with_asi_template.mph
steps:
- id: S00
  name: init
  process_type: init
  update_rule: init
  run_devices: []
  run_mats: []
  mat_inputs: {}
  run_wafer: true
  wafer_template: base
  wafer_inputs:
    update:
    - FEOL
  calibration_group: G0_init
  experiment_step: S00
- id: S01
  name: ONONdep
  process_type: deposition
  update_rule: onon_deposition
  run_devices:
  - name: device_default
    template_key: device_onon
  run_mats: []
  mat_inputs: {}
  run_wafer: true
  wafer_template: base
  wafer_inputs:
    update:
    - ONON_layer
  calibration_group: G1_ONON_base
  experiment_step: S01
- id: S02
  name: trench_etch
  process_type: etch
  update_rule: onon_trench_release
  run_devices:
  - name: device_default
    template_key: device_trench
  run_mats:
  - mat1
  mat_inputs:
    mat1: device_default
  run_wafer: true
  wafer_template: base
  wafer_inputs:
    update:
    - mat1
    - ONON_layer
  calibration_group: G2_trench_release
  experiment_step: S02
- id: S03
  name: trench_fill
  process_type: fill
  update_rule: trench_ox_fill
  run_devices: []
  run_mats:
  - mat2
  mat_inputs:
    mat2: device_default
  run_wafer: true
  wafer_template: base
  wafer_inputs:
    update:
    - mat2
  calibration_group: G3_ox_fill
  experiment_step: S03
- id: S04
  name: pillar_etch
  process_type: etch
  update_rule: pillar_diameter_update
  run_devices:
  - name: device_default
    template_key: device_pillar
  - name: device2_for_mat3
    template_key: device2_mat3
  run_mats:
  - mat1
  - mat2
  - mat3
  mat_inputs:
    mat1: device_default
    mat2: device_default
    mat3: device2_for_mat3
  run_wafer: true
  wafer_template: base
  wafer_inputs:
    update:
    - mat1
    - mat2
    - mat3
  calibration_group: G4_pillar_diameter
  experiment_step: S04
- id: S05a
  name: pillar_dep1
  process_type: deposition
  update_rule: pillar_dep1
  run_devices: []
  run_mats:
  - mat2
  mat_inputs:
    mat2: device_default
  run_wafer: true
  wafer_template: base
  wafer_inputs:
    update:
    - mat2
  calibration_group: G5_dep1
  experiment_step: S05a
- id: S05b
  name: pillar_dep2
  process_type: deposition
  update_rule: pillar_dep2
  run_devices: []
  run_mats:
  - mat2
  mat_inputs:
    mat2: device_default
  run_wafer: true
  wafer_template: base
  wafer_inputs:
    update:
    - mat2
  calibration_group: G5_dep2
  experiment_step: S05b
- id: S05c
  name: pillar_dep3
  process_type: deposition
  update_rule: pillar_dep3
  run_devices: []
  run_mats:
  - mat2
  mat_inputs:
    mat2: device_default
  run_wafer: true
  wafer_template: base
  wafer_inputs:
    update:
    - mat2
  calibration_group: G5_dep3
  experiment_step: S05c
- id: S05d
  name: pillar_dep4
  process_type: deposition
  update_rule: pillar_dep4
  run_devices: []
  run_mats:
  - mat2
  mat_inputs:
    mat2: device_default
  run_wafer: true
  wafer_template: base
  wafer_inputs:
    update:
    - mat2
  calibration_group: G5_dep4
  experiment_step: S05d
- id: S05e
  name: pillar_dep5
  process_type: deposition
  update_rule: pillar_dep5
  run_devices: []
  run_mats:
  - mat2
  mat_inputs:
    mat2: device_default
  run_wafer: true
  wafer_template: base
  wafer_inputs:
    update:
    - mat2
  calibration_group: G5_dep5
  experiment_step: S05e
- id: S06
  name: dpillar_form
  process_type: form
  update_rule: dpillar_onon_release
  run_devices:
  - name: device_default
    template_key: device_pillar
  - name: device2_for_mat3
    template_key: device2_mat3
  run_mats:
  - mat1
  - mat2
  - mat3
  mat_inputs:
    mat1: device_default
    mat2: device_default
    mat3: device2_for_mat3
  run_wafer: true
  wafer_template: base
  wafer_inputs:
    update:
    - mat1
    - mat2
    - mat3
    - ONON_layer
  calibration_group: G6_dpillar_release
  experiment_step: S06
- id: S07
  name: aSi_dep
  process_type: deposition
  update_rule: asi_deposition
  run_devices: []
  run_mats: []
  mat_inputs: {}
  run_wafer: true
  wafer_template: with_asi
  wafer_inputs:
    update:
    - aSi_layer
  calibration_group: G7_aSi
  experiment_step: S07
- id: S08
  name: mat_remove
  process_type: remove
  update_rule: mat_remove_onon_release
  run_devices:
  - name: device_default
    template_key: device_final
  - name: device2_for_mat3
    template_key: device2_mat3
  run_mats:
  - mat1
  - mat2
  - mat3
  mat_inputs:
    mat1: device_default
    mat2: device_default
    mat3: device2_for_mat3
  run_wafer: true
  wafer_template: base
  wafer_inputs:
    update:
    - mat1
    - mat2
    - mat3
    - ONON_layer
    - aSi_layer
  calibration_group: G8_mat_remove
  experiment_step: S08
- id: S09
  name: W_fill
  process_type: fill
  update_rule: w_fill
  run_devices:
  - name: device_default
    template_key: device_final
  - name: device2_for_mat3
    template_key: device2_mat3
  run_mats:
  - mat1
  - mat2
  - mat3
  mat_inputs:
    mat1: device_default
    mat2: device_default
    mat3: device2_for_mat3
  run_wafer: true
  wafer_template: base
  wafer_inputs:
    update:
    - mat1
    - mat2
    - mat3
  calibration_group: G9_W_fill
  experiment_step: S09
- id: S10
  name: final
  process_type: final
  update_rule: final
  run_devices:
  - name: device_default
    template_key: device_final
  - name: device2_for_mat3
    template_key: device2_mat3
  run_mats:
  - mat1
  - mat2
  - mat3
  mat_inputs:
    mat1: device_default
    mat2: device_default
    mat3: device2_for_mat3
  run_wafer: true
  wafer_template: base
  wafer_inputs:
    update:
    - mat1
    - mat2
    - mat3
  calibration_group: G10_final
  experiment_step: S10
